<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #07070f;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 50% at 15% 50%, rgba(168,85,247,0.12) 0%, transparent 100%),
        radial-gradient(ellipse 60% 50% at 85% 30%, rgba(30,144,255,0.12) 0%, transparent 100%),
        radial-gradient(ellipse 40% 40% at 50% 90%, rgba(255,71,87,0.08) 0%, transparent 100%);
    }

    canvas#particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      padding: 2rem;
    }

    header { text-align: center; }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #58a6ff 0%, #bc8cff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.35rem;
    }

    header p { color: #4a5568; font-size: 0.9rem; }

    .buttons {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Each button lives in a perspective container */
    .btn-wrap { perspective: 600px; }

    .btn {
      position: relative;
      width: 150px;
      height: 64px;
      border: none;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transform-style: preserve-3d;
      will-change: transform;
      overflow: hidden;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Moving glare highlight */
    .btn .glare {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.38) 0%, transparent 65%);
      pointer-events: none;
      z-index: 3;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn:hover .glare { opacity: 1; }

    /* Top gloss stripe */
    .btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.18), transparent);
      border-radius: 16px 16px 0 0;
      pointer-events: none;
      z-index: 2;
    }

    .btn span {
      position: relative;
      z-index: 4;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }

    .btn-red {
      background: linear-gradient(145deg, #ff6b81, #c0392b);
      box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 12px 32px rgba(255,71,87,0.55), 0 4px 10px rgba(0,0,0,0.4);
    }
    .btn-green {
      background: linear-gradient(145deg, #55efc4, #00b894);
      box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 12px 32px rgba(46,213,115,0.5), 0 4px 10px rgba(0,0,0,0.4);
    }
    .btn-blue {
      background: linear-gradient(145deg, #74b9ff, #0984e3);
      box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 12px 32px rgba(30,144,255,0.5), 0 4px 10px rgba(0,0,0,0.4);
    }
    .btn-purple {
      background: linear-gradient(145deg, #d39ff0, #8e44ad);
      box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 12px 32px rgba(168,85,247,0.5), 0 4px 10px rgba(0,0,0,0.4);
    }

    #log {
      background: rgba(22,27,34,0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(48,54,61,0.8);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      width: 100%;
      max-width: 480px;
      min-height: 80px;
      font-size: 0.82rem;
      color: #8b949e;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    #log .entry {
      display: flex;
      gap: 0.5rem;
      align-items: baseline;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

    #log .entry .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    #log .entry.ok .dot  { background: #3fb950; }
    #log .entry.err .dot { background: #da3633; }
    #log .entry.ok  .msg { color: #3fb950; }
    #log .entry.err .msg { color: #da3633; }
    #log .placeholder    { color: #484f58; font-style: italic; }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <canvas id="particles"></canvas>

  <div class="page">
    <header>
      <h1>Click Tracker</h1>
      <p>Click any button — it gets logged to Supabase.</p>
    </header>

    <div class="buttons">
      <div class="btn-wrap">
        <button class="btn btn-red" data-id="red" data-color="#ff4757">
          <div class="glare"></div><span>Red</span>
        </button>
      </div>
      <div class="btn-wrap">
        <button class="btn btn-green" data-id="green" data-color="#2ed573">
          <div class="glare"></div><span>Green</span>
        </button>
      </div>
      <div class="btn-wrap">
        <button class="btn btn-blue" data-id="blue" data-color="#1e90ff">
          <div class="glare"></div><span>Blue</span>
        </button>
      </div>
      <div class="btn-wrap">
        <button class="btn btn-purple" data-id="purple" data-color="#a855f7">
          <div class="glare"></div><span>Purple</span>
        </button>
      </div>
    </div>

    <div id="log">
      <span class="placeholder">No clicks yet...</span>
    </div>
  </div>

  <script>
    // ── Supabase ────────────────────────────────────────────────────
    const { createClient } = supabase;
    const db = createClient(
      'https://wmvoqgbaqhxymozvpryl.supabase.co',
      'sb_publishable_bU2TBChmUrKL3Su1oiI9cw_gOZIXi98'
    );

    const logEl = document.getElementById('log');
    let ipCache = null;

    async function getIP() {
      if (ipCache) return ipCache;
      const res = await fetch('https://api.ipify.org?format=json');
      const { ip } = await res.json();
      ipCache = ip;
      return ip;
    }

    function addLog(type, text) {
      logEl.querySelector('.placeholder')?.remove();
      const entry = document.createElement('div');
      entry.className = `entry ${type}`;
      entry.innerHTML = `<span class="dot"></span><span class="msg">${text}</span>`;
      logEl.prepend(entry);
      [...logEl.querySelectorAll('.entry')].slice(6).forEach(el => el.remove());
    }

    async function trackClick(btn) {
      if (btn.dataset.pending) return;
      btn.dataset.pending = '1';
      try {
        const ip = await getIP();
        const { error } = await db.from('clicks').insert({ button: btn.dataset.id, user_ip: ip });
        if (error) throw error;
        addLog('ok', `"${btn.dataset.id}" logged from ${ip}`);
      } catch (err) {
        addLog('err', `Error: ${err.message}`);
      } finally {
        delete btn.dataset.pending;
      }
    }

    // ── Particle / shockwave system ─────────────────────────────────
    const canvas = document.getElementById('particles');
    const ctx    = canvas.getContext('2d');
    let particles  = [];
    let shockwaves = [];

    function resizeCanvas() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function burst(x, y, hex) {
      for (let i = 0; i < 42; i++) {
        const angle = (Math.PI * 2 * i / 42) + (Math.random() - 0.5) * 0.7;
        const speed = 2 + Math.random() * 7;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          r: 2.5 + Math.random() * 4.5,
          alpha: 1,
          color: hex,
        });
      }
      shockwaves.push({ x, y, r: 0, alpha: 0.9, color: hex });
    }

    function particleLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      shockwaves = shockwaves.filter(s => s.alpha > 0.01);
      for (const s of shockwaves) {
        s.r    += (90 - s.r) * 0.14;
        s.alpha *= 0.84;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.strokeStyle = s.color + Math.floor(s.alpha * 255).toString(16).padStart(2, '0');
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }

      particles = particles.filter(p => p.alpha > 0.01 && p.r > 0.3);
      for (const p of particles) {
        p.x  += p.vx;
        p.y  += p.vy;
        p.vy += 0.22;
        p.vx *= 0.97;
        p.alpha *= 0.93;
        p.r     *= 0.97;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color + Math.floor(p.alpha * 255).toString(16).padStart(2, '0');
        ctx.fill();
      }

      requestAnimationFrame(particleLoop);
    }
    particleLoop();

    // ── 3D Button system ────────────────────────────────────────────
    class Button3D {
      constructor(el) {
        this.el    = el;
        this.glare = el.querySelector('.glare');
        this.color = el.dataset.color;

        // Spring values: current → target
        this.rx = 0;  this.trx = 0;   // rotateX
        this.ry = 0;  this.try_ = 0;  // rotateY
        this.tx = 0;  this.ttx = 0;   // translateX (magnetic)
        this.ty = 0;  this.tty = 0;   // translateY (magnetic)
        this.tz = 0;  this.ttz = 0;   // translateZ (hover lift)
        this.sc = 1;  this.tsc = 1;   // scale

        // Idle float — unique per button
        this.floatPhase = Math.random() * Math.PI * 2;
        this.floatSpeed = 0.017 + Math.random() * 0.008;
        this.hovered    = false;

        this._bind();
        this._loop();
      }

      _bind() {
        const el = this.el;

        el.addEventListener('mousemove', e => {
          const r   = el.getBoundingClientRect();
          const dx  = (e.clientX - (r.left + r.width  / 2)) / (r.width  / 2);
          const dy  = (e.clientY - (r.top  + r.height / 2)) / (r.height / 2);
          this.try_ = dx * 20;
          this.trx  = -dy * 13;
          this.ttx  = dx * 9;
          this.tty  = dy * 9;
          if (this.glare) {
            this.glare.style.left = (e.clientX - r.left) + 'px';
            this.glare.style.top  = (e.clientY - r.top)  + 'px';
          }
        });

        el.addEventListener('mouseenter', () => {
          this.hovered = true;
          this.ttz = 18;
        });

        el.addEventListener('mouseleave', () => {
          this.hovered = false;
          this.trx = 0; this.try_ = 0;
          this.ttx = 0; this.tty  = 0;
          this.ttz = 0;
        });

        el.addEventListener('mousedown', () => {
          this.tsc = 0.92;
          this.trx = 8;
          this.ttz = 2;
        });

        el.addEventListener('mouseup', () => {
          this.tsc = 1;
          this.ttz = this.hovered ? 18 : 0;
        });

        el.addEventListener('click', e => {
          const r = el.getBoundingClientRect();
          burst(r.left + r.width / 2, r.top + r.height / 2, this.color);
          trackClick(el);
        });
      }

      _lerp(a, b, t) { return a + (b - a) * t; }

      _loop() {
        this.floatPhase += this.floatSpeed;
        const floatY  = this.hovered ? 0 : Math.sin(this.floatPhase)       * 5;
        const floatRx = this.hovered ? 0 : Math.sin(this.floatPhase * 0.7) * 1.8;

        this.rx = this._lerp(this.rx, this.trx  + floatRx, 0.11);
        this.ry = this._lerp(this.ry, this.try_,            0.11);
        this.tx = this._lerp(this.tx, this.ttx,             0.11);
        this.ty = this._lerp(this.ty, this.tty  + floatY,   0.11);
        this.tz = this._lerp(this.tz, this.ttz,             0.11);
        this.sc = this._lerp(this.sc, this.tsc,             0.17);

        this.el.style.transform =
          `translate(${this.tx}px, ${this.ty}px) ` +
          `translateZ(${this.tz}px) ` +
          `rotateX(${this.rx}deg) ` +
          `rotateY(${this.ry}deg) ` +
          `scale(${this.sc})`;

        requestAnimationFrame(() => this._loop());
      }
    }

    document.querySelectorAll('.btn').forEach(btn => new Button3D(btn));
  </script>
</body>
</html>
