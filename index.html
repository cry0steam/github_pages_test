<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 2rem;
      gap: 2.5rem;
    }

    header { text-align: center; }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #58a6ff, #bc8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.4rem;
    }

    header p { color: #8b949e; font-size: 0.9rem; }

    .buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      position: relative;
      padding: 0.75rem 1.75rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      min-width: 130px;
    }

    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-red    { background: #da3633; color: #fff; }
    .btn-green  { background: #238636; color: #fff; }
    .btn-blue   { background: #1f6feb; color: #fff; }
    .btn-purple { background: #8957e5; color: #fff; }

    .btn .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
    }

    .btn.loading .spinner { display: block; }
    .btn.loading { padding-right: 2.5rem; }

    @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

    #log {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      width: 100%;
      max-width: 480px;
      min-height: 80px;
      font-size: 0.82rem;
      color: #8b949e;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    #log .entry {
      display: flex;
      gap: 0.5rem;
      align-items: baseline;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

    #log .entry .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    #log .entry.ok .dot  { background: #3fb950; }
    #log .entry.err .dot { background: #da3633; }
    #log .entry.ok  .msg { color: #3fb950; }
    #log .entry.err .msg { color: #da3633; }
    #log .placeholder    { color: #484f58; font-style: italic; }
  </style>
</head>
<body>

  <header>
    <h1>Click Tracker</h1>
    <p>Click any button — it gets logged to Supabase.</p>
  </header>

  <div class="buttons">
    <button class="btn btn-red"    data-id="red">Red<div class="spinner"></div></button>
    <button class="btn btn-green"  data-id="green">Green<div class="spinner"></div></button>
    <button class="btn btn-blue"   data-id="blue">Blue<div class="spinner"></div></button>
    <button class="btn btn-purple" data-id="purple">Purple<div class="spinner"></div></button>
  </div>

  <div id="log">
    <span class="placeholder">No clicks yet...</span>
  </div>

  <script>
    const SUPABASE_URL = 'https://wmvoqgbaqhxymozvpryl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_bU2TBChmUrKL3Su1oiI9cw_gOZIXi98';

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    const log = document.getElementById('log');
    let ipCache = null;

    async function getIP() {
      if (ipCache) return ipCache;
      const res = await fetch('https://api.ipify.org?format=json');
      const { ip } = await res.json();
      ipCache = ip;
      return ip;
    }

    function addLog(type, text) {
      const placeholder = log.querySelector('.placeholder');
      if (placeholder) placeholder.remove();

      const entry = document.createElement('div');
      entry.className = `entry ${type}`;
      entry.innerHTML = `<span class="dot"></span><span class="msg">${text}</span>`;
      log.prepend(entry);

      // keep last 6 entries
      [...log.querySelectorAll('.entry')].slice(6).forEach(el => el.remove());
    }

    async function trackClick(btn) {
      btn.disabled = true;
      btn.classList.add('loading');

      try {
        const ip = await getIP();
        const { error } = await db.from('clicks').insert({ button: btn.dataset.id, user_ip: ip });

        if (error) throw error;

        addLog('ok', `"${btn.dataset.id}" logged from ${ip}`);
      } catch (err) {
        addLog('err', `Error: ${err.message}`);
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    }

    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('click', () => trackClick(btn));
    });
  </script>
</body>
</html>
